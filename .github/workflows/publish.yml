name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # npm exchanges this for a short-lived publish token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the version bundled with a Node
      # release lags. This also keeps the workflow working when the runner image
      # changes underneath it.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # A release tag that disagrees with package.json publishes the wrong
      # version under the right name, which is worse than failing here.
      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag $tag does not match package.json $pkg"
            exit 1
          fi

      - name: Run the guards before publishing anything
        run: |
          node skills/show-me/scripts/self-test.mjs --repo .
          node skills/show-me/scripts/layout-test.mjs --repo .
          node skills/show-me/scripts/validate.mjs skills/show-me/examples/show-me.system-map.json --repo .

      - name: Pack and show what would ship
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN. Authentication comes from the OIDC identity of this
      # workflow, which npm verifies against the trusted publisher configured on
      # the package. Nothing long-lived is stored anywhere.
      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        run: npm publish --access public
