name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # npm exchanges this for a short-lived publish token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url. It makes setup-node write an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN}, and when that variable is unset the file
      # ends up holding the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX. npm
      # then believes it has a credential, sends the placeholder, is refused,
      # and never falls back to OIDC -- which reads as a permissions problem
      # when it is really a junk token. Without the file, npm has no credential
      # and asks for one via trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs a recent npm; the version bundled with a Node
      # release lags. This also keeps the workflow working when the runner image
      # changes underneath it.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # A release tag that disagrees with package.json publishes the wrong
      # version under the right name, which is worse than failing here.
      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag $tag does not match package.json $pkg"
            exit 1
          fi

      - name: Run the guards before publishing anything
        run: |
          node skills/show-me/scripts/self-test.mjs --repo skills/show-me
          node skills/show-me/scripts/layout-test.mjs --repo skills/show-me
          node skills/show-me/scripts/validate.mjs skills/show-me/examples/show-me.system-map.json --repo skills/show-me

      - name: Pack and show what would ship
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN. Authentication comes from the OIDC identity of this
      # workflow, which npm verifies against the trusted publisher configured on
      # the package. Nothing long-lived is stored anywhere.
      - name: Confirm no stale credential is in the way
        run: |
          echo "npmrc in use: ${NPM_CONFIG_USERCONFIG:-<none>}"
          for f in "${NPM_CONFIG_USERCONFIG:-}" ~/.npmrc ./.npmrc; do
            [ -n "$f" ] && [ -f "$f" ] && { echo "--- $f"; sed -E 's/(_authToken=).*/\1<redacted>/' "$f"; }
          done
          echo "OIDC available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        run: npm publish --access public
