name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # A release tag that disagrees with package.json publishes the wrong
      # version under the right name, which is worse than failing here.
      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag $tag does not match package.json $pkg"
            exit 1
          fi

      - name: Run the guards before publishing anything
        run: |
          node skills/show-me/scripts/self-test.mjs --repo .
          node skills/show-me/scripts/layout-test.mjs --repo .
          node skills/show-me/scripts/validate.mjs skills/show-me/examples/show-me.system-map.json --repo .

      - name: Pack and show what would ship
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
